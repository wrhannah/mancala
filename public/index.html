<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walter vs Dad Mancala</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Walter vs Dad Mancala</h1>
    <p class="subtitle">Open this same site on both phones. One taps Walter, one taps Dad.</p>

    <section class="join-panel">
      <button data-name="Walter">Play as Walter</button>
      <button data-name="Dad">Play as Dad</button>
      <p id="identity"></p>
      <p id="join-error" class="error"></p>
    </section>

    <section id="status" class="status"></section>
    <section id="seats" class="subtitle"></section>

    <section class="board-wrap">
      <div id="board" class="board"></div>
    </section>

    <button id="reset-btn" class="reset-btn">New Game</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
